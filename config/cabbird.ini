; Cabbird host configuration.
;
; Ported from Anomaly's config/anomaly.ini.  The [Analyzer] / [Platform] / [Performance] keys are
; the ones AnalyzerConfig::Load reads (src/platform/windows/config.cpp); [Profiles] is carried over
; with the Unity/IL2CPP profile directories this project actually uses.
;
; The platform preview stages this file to <preview dir>\Cabbird\cabbird.ini.
; The injected overlay reads the same file from its own runtime root.

[Analyzer]
PipePrefix=Cabbird
MaxScanResults=1024

[Platform]
Enabled=1
Visible=0
Embedded=1
AttachToProcessWindow=1
ToggleKey=45
Language=auto
PluginDirectory=plugins

[Performance]
UpdateSlowMilliseconds=2
DrawSlowMilliseconds=4
PlayerSnapshotTickInterval=1
; The entity walk's sampling divisor, in game ticks.  1 = rebuild the entity set every tick
; (default).  It no longer controls how often a POSITION or a box is refreshed: those come from
; a direct call to the compiled Transform::get_position body, which costs a function call, so the
; positions and the eight projected corners are new on every tick whatever this value says.
;
; What this throttles is the entity SET and its bookkeeping -- which entities exist, their class,
; their name, their category.  Raising it makes a newly spawned entity appear up to
; interval-1 ticks late and costs nothing else.  The first walk after the ESP starts is never
; skipped, whatever this value.
;
; Only if the direct position call is refused (a missing profile, a prologue mismatch, a fault,
; or disagreement with the reflection route -- the reason is reported as `directPosition` in the
; status document) does the adapter floor this at 8, because then a position costs ~1.29 ms again.
EntitySnapshotTickInterval=1
; Whether the entity walk may call `UnityEngine.Transform::get_position`'s compiled body directly
; instead of through `il2cpp_runtime_invoke` (default 1 = yes).  This is the ONLY place in this
; port that CALLS game code rather than reading it, and it is what makes the walk cost a function
; call per entity instead of 1.29 ms per entity.
;
; The call is not taken on trust: the body's first 24 bytes are re-read from the live process and
; compared against the profile before the first call, the managed object is canaried across the
; call, and the value returned must agree with the reflection route.  Any failure refuses the path
; permanently and is published as `directPosition` in the status document.
;
; Set this to 0 to fall back to the reflection route without rebuilding: the walk then costs
; ~1.29 ms per entity, so the sampling interval above is floored to 8 to keep the frame rate.
; That switch exists so "is the fast path causing this?" is answerable with one line.
DirectPositionCall=1
ActorSnapshotTickInterval=60

[Profiles]
; The game id only.  `Directory` / `LocalDirectory` / `ManagedDirectory` used to sit here and are
; gone with the upstream BuildProfile layer they pointed at -- the Unity build profile is read
; from the packaged `profiles/unity-build-profiles.json` by absolute path.  Listing them here
; would advertise keys nothing reads.
Game=ap

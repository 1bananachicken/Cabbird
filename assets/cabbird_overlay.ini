# cabbird_overlay.ini -- runtime switches for the manually mapped overlay.
#
# Deploy this file next to cabbird_inject.exe (the injector resolves it there first,
# then beside the log directory).  If it is missing every key falls back to the
# defaults below, which are "level 1" (hook + draw).
#
# Test ladder:
#   level 0  probe only      enable_hooks=0
#   level 1  blank overlay    enable_hooks=1 enable_overlay=1 wndproc_hook=0
#   level 2  interactive      enable_hooks=1 enable_overlay=1 wndproc_hook=1

[runtime]
# 0 = do not touch the game at all: only log that the DLL loaded and what it
#     resolved.  Safe first step.
enable_hooks=1
# 0 = hook Present but draw nothing (isolates "does the hook survive?").
enable_overlay=1
# Milliseconds to wait before touching the process, so the engine
# finishes booting first.
init_delay_ms=1500
# Dummy-device creation retry policy (the GPU/driver may not be ready yet).
retry_interval_ms=500
# 0 = retry forever.
retry_attempts=20

[overlay]
# Subclass the game's window procedure for mouse/keyboard input.  Off by
# default: it is the most invasive step and is not needed for a blank overlay.
wndproc_hook=0
status_text=1

[logging]
# 0 off, 1 error, 2 info, 3 debug
level=3
# Mirror every line to OutputDebugString as well as the log file.
debugger=1

[manual_map]
# --- IL2CPP probe (manual-map route) -----------------------------------------
# The probe runs on the render thread's frame counter, not on a thread created at
# load time.  That ordering is deliberate: creating the thread before the engine
# has started reliably produced "Fatal error in GC: Collecting from unknown
# thread" from Boehm, and the game died a few seconds in.
il2cpp_probe=1
il2cpp_probe_after_frames=240

# --- dumper ------------------------------------------------------------------
# OPT-IN.  Left at 0, an ordinary game session does nothing but render: no dump
# is written, no memory is scanned, no 9 MB file appears in the log directory.
#
# Turn it to 1 only for a session whose purpose IS to extract the type system.
# It is read-only either way, but it costs ~900 ms (methods on: much more) and
# writes dump.cs plus il2cpp_images.txt and il2cpp_regions.txt.
il2cpp_dump=0

# The three walks below all force LAZY CLASS INITIALISATION inside the runtime,
# unlike the field walk, which is a plain metadata read.  A run with two of them
# enabled (properties + interfaces) died with
#
#     0xC0000005 (ACCESS_VIOLATION, READ)
#     GameAssembly.dll + 0x13E15C2, accessing 0x0000000000000135
#
# on the probe thread -- a null base plus the offset of
# Il2CppClass::instance_size/actualSize, i.e. a class the runtime had not finished
# building.  The fields-only walk had completed cleanly on the same game.
#
# Two fixes went in: the dump now attaches its thread to the IL2CPP domain first
# (il2cpp_thread_attach), and every call that can fault is SEH-guarded so the
# worst case is a skipped class instead of a dead game.  A guard that trips is
# counted and reported as `il2cpp_dump_contained_faults`, and the dump says
# INCOMPLETE in its header.
#
# They are STILL off by default, because a configuration that has been observed
# to work is the only honest default.  Turn them on one at a time:
#
#   1. il2cpp_dump_methods=1                      (methods + signatures + RVAs)
#   2. il2cpp_dump_properties=1                   (properties)
#   3. il2cpp_dump_interfaces=1                   (interface lists)
#
# After each step, check the log for `contained_faults` and confirm the game is
# still alive.  Step up to the next one only if that run was clean.
il2cpp_dump_methods=0
# Restrict methods to images whose name contains one of these substrings
# (space- or comma-separated).  Empty = EVERY image.
#
# WHY THE SUGGESTED VALUE BELOW IS NOT "Azur": this target's own main assembly is
# `Assembly-CSharp.dll`, whose name does not contain "Azur", so an `Azur` filter drops the
# game's own code -- tens of thousands of classes -- while the dump still looks full.
# A filter that excludes the assembly you care about is worse than no filter.
#
# These four substrings cover this target's own code.  `il2cpp_dump_max_classes=200`
# still gives a first attempt that finishes in seconds.
il2cpp_dump_methods_images=Azur,Assembly-CSharp,Proxima,Lens
il2cpp_dump_properties=0
il2cpp_dump_interfaces=0
# Per-image / per-class caps, so a first attempt can be deliberately small.
# 0 = no cap.
il2cpp_dump_max_classes=0
il2cpp_dump_max_methods_per_class=0

# Recovers the decrypted global-metadata blob and writes
# global-metadata.decrypted.dat for Il2CppDumper.  Scans committed memory of
# every type (private, mapped, image) looking for the metadata header.
#
# NOTE: these ini keys are read by nothing: the dump is `cabbird.unity.dump`, driven by the
# UnityDump plugin (its defaults are the values written here).  They are kept as DOCUMENTATION
# of the configuration that is known to work, not as a control surface: editing them changes
# nothing at runtime.  Turn the behaviour on from the plugin window instead.
il2cpp_dump_metadata=1
